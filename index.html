<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192x192.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="theme-color" content="#4CAF50">

<title>Sudoku</title>

<style>
body{
  margin:0;
  text-align:center;
  font-family:Arial;
  background:#f4f6f8;
}

#grid{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  width:95vw;
  max-width:500px;
  margin:20px auto;
}

.cell{
  aspect-ratio:1;
  border:1px solid #999;
  position:relative;
}

.cell:nth-child(3n){border-right:3px solid black;}
.cell:nth-child(9n+1){border-left:3px solid black;}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){
  border-bottom:3px solid black;
}
.cell:nth-child(-n+9){border-top:3px solid black;}

.selected{background:#ffe9a8;}
.noteSame{background:#ffd54f;}

.big{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.notes{
  position:absolute;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  font-size:10px;
  color:#c44;
}

.notes div{
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  padding:6px 8px;
  border-radius:6px;
  border:2px solid #555;
  margin:3px;
  font-size:16px;
}

.numPad{display:flex;justify-content:center;}
.numBtn{background:#fff3cd;}
.ctrlBtn{background:#ffe0b2;}
.mainBtn{background:#c8e6c9;}
.diffBtn{background:#bbdefb;}
</style>
</head>

<body>

<h2>Sudoku</h2>
<div id="grid"></div>
<div id="controls"></div>

<script>

let grid=document.getElementById("grid");
let controls=document.getElementById("controls");

let cells=[];
let selectedIndex=-1;
let savedState=null;
let inTest=false;

/* CREA CELLE */
for(let i=0;i<81;i++){
  let cell=document.createElement("div");
  cell.className="cell";

  let notes=document.createElement("div");
  notes.className="notes";

  let noteEls=[];

  for(let n=1;n<=9;n++){
    let d=document.createElement("div");
    d.innerText=n;
    notes.appendChild(d);
    noteEls.push(d);
  }

  let big=document.createElement("div");
  big.className="big";

  cell.appendChild(notes);
  cell.appendChild(big);

  cells.push({
    el:cell,
    value:null,
    fixed:false,
    big:big,
    notes:notes,
    noteEls:noteEls
  });

  cell.onclick=function(){
    let c=cells[i];

    if(selectedIndex===i && c.value && !c.fixed){
      c.value=null;
      c.big.innerText="";
      recalc();
      highlight(i);
      return;
    }

    selectedIndex=i;
    highlight(i);
  };

  grid.appendChild(cell);
}

/* VALIDAZIONE */
function isValid(index,num){
  let row=Math.floor(index/9);
  let col=index%9;

  for(let i=row*9;i<row*9+9;i++)
    if(i!==index && cells[i].value===num) return false;

  for(let i=col;i<81;i+=9)
    if(i!==index && cells[i].value===num) return false;

  let sr=Math.floor(row/3)*3;
  let sc=Math.floor(col/3)*3;

  for(let r=sr;r<sr+3;r++)
    for(let c=sc;c<sc+3;c++){
      let i=r*9+c;
      if(i!==index && cells[i].value===num) return false;
    }

  return true;
}

/* HIGHLIGHT */
function highlight(i){
  cells.forEach(c=>{
    c.el.classList.remove("selected");
    c.noteEls.forEach(n=>n.classList.remove("noteSame"));
  });

  let val=cells[i].value;
  cells[i].el.classList.add("selected");

  if(!val) return;

  cells.forEach(c=>{
    if(!c.value){
      c.noteEls[val-1].classList.add("noteSame");
    }
  });
}

/* RECALC */
function recalc(){
  cells.forEach(c=>{
    c.notes.style.display=c.value?"none":"grid";
    c.noteEls.forEach(n=>n.style.visibility="visible");
  });

  for(let i=0;i<81;i++){
    let v=cells[i].value;
    if(!v) continue;

    let row=Math.floor(i/9);
    let col=i%9;

    for(let j=row*9;j<row*9+9;j++)
      if(!cells[j].value)
        cells[j].noteEls[v-1].style.visibility="hidden";

    for(let j=col;j<81;j+=9)
      if(!cells[j].value)
        cells[j].noteEls[v-1].style.visibility="hidden";

    let sr=Math.floor(row/3)*3;
    let sc=Math.floor(col/3)*3;

    for(let r=sr;r<sr+3;r++)
      for(let c=sc;c<sc+3;c++){
        let idx=r*9+c;
        if(!cells[idx].value)
          cells[idx].noteEls[v-1].style.visibility="hidden";
      }
  }
}

/* GENERATORE (uguale al tuo) */
function generate(empty){
  let grid=new Array(81).fill(0);

  function valid(i,n){
    let r=Math.floor(i/9);
    let c=i%9;

    for(let x=0;x<9;x++){
      if(grid[r*9+x]===n) return false;
      if(grid[x*9+c]===n) return false;
    }

    let sr=Math.floor(r/3)*3;
    let sc=Math.floor(c/3)*3;

    for(let rr=sr;rr<sr+3;rr++)
      for(let cc=sc;cc<sc+3;cc++)
        if(grid[rr*9+cc]===n) return false;

    return true;
  }

  function fill(i){
    if(i===81) return true;
    let nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);

    for(let n of nums){
      if(valid(i,n)){
        grid[i]=n;
        if(fill(i+1)) return true;
        grid[i]=0;
      }
    }
    return false;
  }

  fill(0);

  let holes=empty;
  while(holes>0){
    let i=Math.floor(Math.random()*81);
    if(grid[i]!==0){
      grid[i]=0;
      holes--;
    }
  }

  cells.forEach((c,i)=>{
    if(grid[i]){
      c.value=grid[i];
      c.big.innerText=grid[i];
      c.fixed=true;
    }else{
      c.value=null;
      c.big.innerText="";
      c.fixed=false;
    }
  });

  recalc();
}

/* SAVE */
function saveGame(){
  let data=cells.map(c=>({v:c.value,f:c.fixed}));
  localStorage.setItem("sudoku",JSON.stringify(data));
}

/* LOAD */
function loadGame(){
  let data=JSON.parse(localStorage.getItem("sudoku"));
  if(!data) return;

  cells.forEach((c,i)=>{
    c.value=data[i].v;
    c.fixed=data[i].f;
    c.big.innerText=c.value||"";
  });

  recalc();
}

/* AVVIO */
recalc();

/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js")
    .then(() => console.log("Service Worker attivo"))
    .catch(err => console.log("Errore SW:", err));
}

</script>

</body>
</html>
