<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192x192.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="theme-color" content="#4CAF50">

<title>Sudoku</title>

<style>

body {
  margin: 0;
  text-align: center;
  font-family: Arial;
  background: #f4f6f8;
}

#grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: 95vw;
  max-width: 500px;
  margin: 20px auto;
}

.cell {
  aspect-ratio: 1;
  border: 1px solid #999;
  position: relative;
}

/* COLORI */
.selected { background:#ffe082; }
.highlight { background:#e3f2fd; }
.same { background:#fff59d; }

/* NUMERO GRANDE */
.big {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

/* NOTE */
.notes {
  position:absolute;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  font-size:10px;
  color:#c44;
}

.notes div {
  display:flex;
  align-items:center;
  justify-content:center;
}

/* BOTTONI */
button {
  margin:5px;
  padding:10px 15px;
  border-radius:12px;
  border:2px solid #444;
  background:#e6e6a8;
  font-size:16px;
}

.num { background:#f0f0f0; }
.main { background:#c8e6c9; }
.ctrl { background:#ffe0b2; }
.diff { background:#bbdefb; }

/* BORDI 3x3 */
.cell:nth-child(3n) { border-right: 3px solid black; }
.cell:nth-child(9n+1) { border-left: 3px solid black; }
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 3px solid black;
}
.cell:nth-child(-n+9) { border-top: 3px solid black; }

</style>
</head>

<body>

<h2>Sudoku</h2>

<div id="grid"></div>
<div id="controls"></div>

<script>

let grid = document.getElementById("grid");
let controls = document.getElementById("controls");

let cells = [];
let selectedIndex = -1;
let gameOn = false;
let savedState = null;
let inTest = false;

/* CREA CELLE */
for (let i = 0; i < 81; i++) {

  let cell = document.createElement("div");
  cell.className = "cell";

  let notes = document.createElement("div");
  notes.className = "notes";

  let noteEls = [];

  for (let n=1;n<=9;n++){
    let d=document.createElement("div");
    d.innerText=n;
    notes.appendChild(d);
    noteEls.push(d);
  }

  let big=document.createElement("div");
  big.className="big";

  cell.appendChild(notes);
  cell.appendChild(big);

  cells.push({
    el:cell,
    value:null,
    fixed:false,
    big:big,
    notes:notes,
    noteEls:noteEls
  });

  cell.onclick=function(){
    if(!gameOn) return;
    selectedIndex=i;
    highlight(i);
  };

  grid.appendChild(cell);
}

/* EVIDENZIA */
function highlight(index){

  cells.forEach(c=>{
    c.el.classList.remove("selected","highlight","same");
  });

  let row=Math.floor(index/9);
  let col=index%9;
  let val=cells[index].value;

  cells.forEach((c,i)=>{
    let r=Math.floor(i/9);
    let co=i%9;

    let sameBox =
      Math.floor(r/3)==Math.floor(row/3) &&
      Math.floor(co/3)==Math.floor(col/3);

    if(r==row || co==col || sameBox){
      c.el.classList.add("highlight");
    }

    if(val && c.value==val){
      c.el.classList.add("same");
    }
  });

  cells[index].el.classList.add("selected");
}

/* NOTE AUTOMATICHE */
function recalc(){

  cells.forEach(c=>{
    for(let n of c.noteEls) n.style.visibility="visible";
    if(!c.value) c.notes.style.display="grid";
  });

  for(let i=0;i<81;i++){
    let val=cells[i].value;
    if(val){
      cells[i].notes.style.display="none";

      let row=Math.floor(i/9);
      let col=i%9;

      for(let j=row*9;j<row*9+9;j++)
        cells[j].noteEls[val-1].style.visibility="hidden";

      for(let j=col;j<81;j+=9)
        cells[j].noteEls[val-1].style.visibility="hidden";

      let sr=Math.floor(row/3)*3;
      let sc=Math.floor(col/3)*3;

      for(let r=sr;r<sr+3;r++)
        for(let c=sc;c<sc+3;c++)
          cells[r*9+c].noteEls[val-1].style.visibility="hidden";
    }
  }
}

/* NUMERI */
for(let n=1;n<=9;n++){
  let b=document.createElement("button");
  b.innerText=n;
  b.className="num";

  b.onclick=function(){
    if(!gameOn || selectedIndex==-1) return;

    let c=cells[selectedIndex];
    if(c.fixed) return;

    if(c.value===n){
      c.value=null;
      c.big.innerText="";
    } else {
      c.value=n;
      c.big.innerText=n;
    }

    recalc();
    highlight(selectedIndex);
  };

  controls.appendChild(b);
}

/* RIGA 1 */
controls.appendChild(document.createElement("br"));

let reset=btn("RESET","ctrl",()=>{
  cells.forEach(c=>{
    c.value=null;
    c.fixed=false;
    c.big.innerText="";
  });
  recalc();
});

let fissa=btn("FISSA","ctrl",()=>{
  cells.forEach(c=>{
    if(c.value){
      c.fixed=true;
      c.big.style.color="black";
    }
  });
});

let prova=btn("PROVA","ctrl",()=>{
  if(!inTest){
    savedState=cells.map(c=>({value:c.value}));
    inTest=true;
    prova.innerText="TORNA";
  }else{
    cells.forEach((c,i)=>{
      c.value=savedState[i].value;
      c.big.innerText=c.value||"";
    });
    recalc();
    inTest=false;
    prova.innerText="PROVA";
  }
});

/* RIGA 2 */
controls.appendChild(document.createElement("br"));

let on=btn("ON","main",()=>{
  loadGame();
  gameOn=true;
});

let off=btn("OFF","main",()=>{
  saveGame();
  gameOn=false;
});

/* RIGA 3 */
controls.appendChild(document.createElement("br"));

btn("EASY","diff",()=>generate("easy"));
btn("MEDIUM","diff",()=>generate("medium"));
btn("HARD","diff",()=>generate("hard"));

/* FUNZIONE BUTTON */
function btn(txt,cls,fn){
  let b=document.createElement("button");
  b.innerText=txt;
  b.className=cls;
  b.onclick=fn;
  controls.appendChild(b);
  return b;
}

/* GENERATORE BASE */
function generate(level){

  let holes = level=="easy"?35:level=="medium"?45:55;

  let gridArr = Array.from({length:81},()=>Math.random()<0.5?0:Math.floor(Math.random()*9)+1);

  cells.forEach((c,i)=>{
    if(gridArr[i]){
      c.value=gridArr[i];
      c.big.innerText=c.value;
      c.fixed=true;
    } else {
      c.value=null;
      c.big.innerText="";
      c.fixed=false;
    }
  });

  recalc();
  gameOn=true;
}

/* SAVE */
function saveGame(){
  let data=cells.map(c=>({
    value:c.value,
    fixed:c.fixed
  }));
  localStorage.setItem("sudoku",JSON.stringify(data));
}

function loadGame(){
  let data=JSON.parse(localStorage.getItem("sudoku"));
  if(!data) return;

  cells.forEach((c,i)=>{
    c.value=data[i].value;
    c.big.innerText=c.value||"";
    c.fixed=data[i].fixed;
  });

  recalc();
}

recalc();

</script>

</body>
</html>
