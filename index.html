<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192x192.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="theme-color" content="#4CAF50">

<title>Sudoku</title>

<style>

body {
  margin: 0;
  text-align: center;
  font-family: Arial;
  background: #f4f6f8;
}

#grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: 95vw;
  max-width: 500px;
  margin: 20px auto;
}

.cell {
  aspect-ratio: 1;
  border: 1px solid #999;
  position: relative;
}

/* bordi */
.cell:nth-child(3n) { border-right: 3px solid black; }
.cell:nth-child(9n+1) { border-left: 3px solid black; }
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 3px solid black;
}
.cell:nth-child(-n+9) { border-top: 3px solid black; }

.selected { background:#ffe9a8; }
.highlight { background:#eef3ff; }
.same { background:#ffe082; }

.big {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

/* NOTE */
.notes {
  position:absolute;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  font-size:10px;
  color:#c44;
}

.notes div {
  display:flex;
  align-items:center;
  justify-content:center;
}

/* BOTTONI */
button {
  padding:10px;
  min-width:40px;

  border-radius:12px;
  border:2px solid #555;
  font-size:18px;
}

.numPad {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}


.ctrlRow { margin-top:10px; }

.numBtn { background:#fff3cd; }
.ctrlBtn { background:#ffe0b2; }
.mainBtn { background:#c8e6c9; }
.diffBtn { background:#bbdefb; }

</style>
</head>

<body>

<h2>Sudoku</h2>
<div id="grid"></div>
<div id="controls"></div>

<script>

let grid = document.getElementById("grid");
let controls = document.getElementById("controls");

let cells = [];
let selectedIndex = -1;
let savedState = null;
let inTest = false;
let gameOn = true;

/* CREA CELLE */
for (let i = 0; i < 81; i++) {

  let cell = document.createElement("div");
  cell.className = "cell";

  let notes = document.createElement("div");
  notes.className = "notes";

  let noteEls = [];

  for (let n=1;n<=9;n++){
    let d=document.createElement("div");
    d.innerText=n;
    notes.appendChild(d);
    noteEls.push(d);
  }

  let big=document.createElement("div");
  big.className="big";

  cell.appendChild(notes);
  cell.appendChild(big);

  cells.push({
    el:cell,
    value:null,
    big:big,
    notes:notes,
    noteEls:noteEls,
    fixed:false
  });

  cell.onclick=function(){

  let c = cells[i];

  // se clicchi su una cella già selezionata → cancella (se non fissa)
  if(selectedIndex === i && c.value && !c.fixed){
    c.value = null;
    c.big.innerText = "";
    recalc();
    highlight(i);
    return;
  }

  // altrimenti seleziona normalmente
  selectedIndex = i;
  highlight(i);
};


  grid.appendChild(cell);
}

/* EVIDENZIA */
function highlight(index){

  cells.forEach(c=>{
    c.el.classList.remove("selected","highlight","same");
  });

  let row=Math.floor(index/9);
  let col=index%9;
  let val=cells[index].value;

  cells.forEach((c,i)=>{
    let r=Math.floor(i/9);
    let co=i%9;

    if(r==row || co==col){
      c.el.classList.add("highlight");
    }

    if(val && c.value==val){
      c.el.classList.add("same");
    }
  });

  cells[index].el.classList.add("selected");
}

/* RECALC NOTE */
function recalc(){

  cells.forEach(c=>{
    for(let n of c.noteEls) n.style.visibility="visible";
    if(!c.value) c.notes.style.display="grid";
  });

  for(let i=0;i<81;i++){
    let val=cells[i].value;
    if(val){
      cells[i].notes.style.display="none";

      let row=Math.floor(i/9);
      let col=i%9;

      for(let j=row*9;j<row*9+9;j++)
        cells[j].noteEls[val-1].style.visibility="hidden";

      for(let j=col;j<81;j+=9)
        cells[j].noteEls[val-1].style.visibility="hidden";
    }
  }
}

/* NUMERI */
let numPad = document.createElement("div");
numPad.className = "numPad";

for(let n=1;n<=9;n++){
  let b=document.createElement("button");
  b.innerText=n;
  b.className="numBtn";

  b.onclick=function(){

    if(selectedIndex==-1) return;

    let c=cells[selectedIndex];
    if(c.fixed) return;

    if(c.value===n){
      c.value=null;
      c.big.innerText="";
    } else {
      c.value=n;
      c.big.innerText=n;
    }

    recalc();
    highlight(selectedIndex);
  };

  numPad.appendChild(b);
}

controls.appendChild(numPad);

/* BOTTONI */

function addButton(text, cls, fn){
  let b=document.createElement("button");
  b.innerText=text;
  b.className=cls;
  b.onclick=fn;
  return b;
}

let row1=document.createElement("div");
row1.className="ctrlRow";

row1.appendChild(addButton("RESET","ctrlBtn",()=>{
  cells.forEach(c=>{
    c.value=null;
    c.fixed=false;
    c.big.innerText="";
  });
  recalc();
}));

row1.appendChild(addButton("FISSA","ctrlBtn",()=>{
  cells.forEach(c=>{
    if(c.value) c.fixed=true;
  });
}));

row1.appendChild(addButton("PROVA","ctrlBtn",()=>{
  if(!inTest){
    savedState=cells.map(c=>c.value);
    inTest=true;
  }else{
    cells.forEach((c,i)=>{
      c.value=savedState[i];
      c.big.innerText=c.value||"";
    });
    recalc();
    inTest=false;
  }
}));

controls.appendChild(row1);

/* ON OFF */
let row2=document.createElement("div");
row2.className="ctrlRow";

row2.appendChild(addButton("ON","mainBtn",loadGame));
row2.appendChild(addButton("OFF","mainBtn",saveGame));

controls.appendChild(row2);

/* DIFFICOLTA */
let row3=document.createElement("div");
row3.className="ctrlRow";

row3.appendChild(addButton("EASY","diffBtn",()=>randomGame(35)));
row3.appendChild(addButton("MEDIUM","diffBtn",()=>randomGame(45)));
row3.appendChild(addButton("HARD","diffBtn",()=>randomGame(55)));

controls.appendChild(row3);

/* GENERATORE SEMPLICE */
function randomGame(empty){

  let gridArr = Array.from({length:81},()=>0);

  for(let i=0;i<81-empty;i++){
    let pos;
    do{
      pos=Math.floor(Math.random()*81);
    }while(gridArr[pos]!=0);

    gridArr[pos]=Math.floor(Math.random()*9)+1;
  }

  cells.forEach((c,i)=>{
    if(gridArr[i]!=0){
      c.value=gridArr[i];
      c.big.innerText=c.value;
      c.fixed=true;
    } else {
      c.value=null;
      c.big.innerText="";
      c.fixed=false;
    }
  });

  recalc();
}

/* SAVE LOAD */
function saveGame(){
  let data=cells.map(c=>({v:c.value,f:c.fixed}));
  localStorage.setItem("sudoku",JSON.stringify(data));
}

function loadGame(){
  let data=JSON.parse(localStorage.getItem("sudoku"));
  if(!data) return;

  cells.forEach((c,i)=>{
    c.value=data[i].v;
    c.fixed=data[i].f;
    c.big.innerText=c.value||"";
  });

  recalc();
}

recalc();

</script>

</body>
</html>
