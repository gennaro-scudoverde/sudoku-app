<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sudoku</title>

<style>

body {
  margin: 0;
  text-align: center;
  font-family: Arial;
  background: #f4f6f8;
}

#grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: 95vw;
  max-width: 500px;
  margin: 20px auto;
}

.cell {
  aspect-ratio: 1;
  border: 1px solid #999;
  position: relative;
}

.big {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.notes {
  position:absolute;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns: repeat(3,1fr);
  font-size:10px;
  color:#c44;
}

.notes div {
  display:flex;
  align-items:center;
  justify-content:center;
}

/* COLORI */
.selected { background:#ffe082; }
.highlight { background:#e3f2fd; }
.same { background:#c8e6c9; }

/* BOTTONI */
button {
  margin:5px;
  padding:10px;
  border-radius:10px;
  font-size:16px;
  border:2px solid #555;
}

.numBtn { background:#fff3cd; }
.ctrlBtn { background:#d1ecf1; }
.mainBtn { background:#c3e6cb; }
.danger { background:#f8d7da; }

/* BORDI 3x3 */
.cell:nth-child(3n) { border-right: 3px solid black; }
.cell:nth-child(9n+1) { border-left: 3px solid black; }
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 3px solid black;
}
.cell:nth-child(-n+9) { border-top: 3px solid black; }

</style>
</head>

<body>

<h2>Sudoku</h2>
<div id="grid"></div>
<div id="controls"></div>

<script>

let grid = document.getElementById("grid");
let controls = document.getElementById("controls");

let cells = [];
let selectedIndex = -1;
let savedState = null;
let inTest = false;
let gameOn = false;

/* CREA CELLE */
for (let i = 0; i < 81; i++) {

  let cell = document.createElement("div");
  cell.className = "cell";

  let notes = document.createElement("div");
  notes.className = "notes";

  let noteEls = [];

  for (let n=1;n<=9;n++){
    let d=document.createElement("div");
    d.innerText=n;
    notes.appendChild(d);
    noteEls.push(d);
  }

  let big=document.createElement("div");
  big.className="big";

  cell.appendChild(notes);
  cell.appendChild(big);

  cells.push({
    el:cell,
    value:null,
    fixed:false,
    big:big,
    notes:notes,
    noteEls:noteEls
  });

  cell.onclick=function(){
    if(!gameOn) return;
    selectedIndex=i;
    highlight(i);
  };

  grid.appendChild(cell);
}

/* EVIDENZIA */
function highlight(index){

  cells.forEach(c=>{
    c.el.classList.remove("selected","highlight","same");
  });

  let row=Math.floor(index/9);
  let col=index%9;
  let val=cells[index].value;

  cells.forEach((c,i)=>{
    let r=Math.floor(i/9);
    let co=i%9;

    let sameBox =
      Math.floor(r/3)==Math.floor(row/3) &&
      Math.floor(co/3)==Math.floor(col/3);

    if(r==row || co==col || sameBox){
      c.el.classList.add("highlight");
    }

    if(val && c.value==val){
      c.el.classList.add("same");
    }
  });

  cells[index].el.classList.add("selected");
}

/* NOTE */
function recalc(){

  cells.forEach(c=>{
    if(!c.value){
      c.notes.style.display="grid";
      for(let n of c.noteEls) n.style.visibility="visible";
    } else {
      c.notes.style.display="none";
    }
  });

  for(let i=0;i<81;i++){
    let val=cells[i].value;
    if(!val) continue;

    let row=Math.floor(i/9);
    let col=i%9;

    for(let j=row*9;j<row*9+9;j++)
      cells[j].noteEls[val-1].style.visibility="hidden";

    for(let j=col;j<81;j+=9)
      cells[j].noteEls[val-1].style.visibility="hidden";

    let sr=Math.floor(row/3)*3;
    let sc=Math.floor(col/3)*3;

    for(let r=sr;r<sr+3;r++)
      for(let c=sc;c<sc+3;c++)
        cells[r*9+c].noteEls[val-1].style.visibility="hidden";
  }
}

/* NUMERI */
for(let n=1;n<=9;n++){
  let b=document.createElement("button");
  b.innerText=n;
  b.className="numBtn";

  b.onclick=function(){
    if(!gameOn || selectedIndex==-1) return;

    let c=cells[selectedIndex];
    if(c.fixed) return;

    if(c.value===n){
      c.value=null;
      c.big.innerText="";
    } else {
      c.value=n;
      c.big.innerText=n;
    }

    recalc();
    highlight(selectedIndex);
  };

  controls.appendChild(b);
}

/* CANCELLA */
let canc=document.createElement("button");
canc.innerText="X";
canc.className="danger";
canc.onclick=function(){
  if(selectedIndex==-1) return;
  let c=cells[selectedIndex];
  if(c.fixed) return;
  c.value=null;
  c.big.innerText="";
  recalc();
};
controls.appendChild(canc);

controls.appendChild(document.createElement("br"));

/* RESET + FISSA + PROVA */
let reset=document.createElement("button");
reset.innerText="RESET";
reset.className="ctrlBtn";
reset.onclick=function(){
  cells.forEach(c=>{
    c.value=null;
    c.fixed=false;
    c.big.innerText="";
  });
  recalc();
};

let fissa=document.createElement("button");
fissa.innerText="FISSA";
fissa.className="mainBtn";
fissa.onclick=function(){
  cells.forEach(c=>{
    if(c.value){
      c.fixed=true;
      c.big.style.color="black";
    }
  });
};

let prova=document.createElement("button");
prova.innerText="PROVA";
prova.className="ctrlBtn";
prova.onclick=function(){
  if(!inTest){
    savedState=cells.map(c=>({value:c.value}));
    inTest=true;
    prova.innerText="TORNA";
  } else {
    cells.forEach((c,i)=>{
      c.value=savedState[i].value;
      c.big.innerText=c.value||"";
    });
    recalc();
    inTest=false;
    prova.innerText="PROVA";
  }
};

controls.appendChild(reset);
controls.appendChild(fissa);
controls.appendChild(prova);

controls.appendChild(document.createElement("br"));

/* ON OFF */
let on=document.createElement("button");
on.innerText="ON";
on.className="mainBtn";
on.onclick=function(){
  loadGame();
  gameOn=true;
};

let off=document.createElement("button");
off.innerText="OFF";
off.className="danger";
off.onclick=function(){
  saveGame();
  gameOn=false;
};

controls.appendChild(on);
controls.appendChild(off);

controls.appendChild(document.createElement("br"));

/* DIFFICOLTÀ */
["easy","medium","hard"].forEach(d=>{
  let b=document.createElement("button");
  b.innerText=d.toUpperCase();
  b.className="ctrlBtn";

  b.onclick=function(){
    loadPuzzle(generateSudoku(d));
    gameOn=true;
  };

  controls.appendChild(b);
});

/* GENERATORE */
function generateSudoku(diff){

  function isValid(g,r,c,n){
    for(let i=0;i<9;i++){
      if(g[r][i]==n||g[i][c]==n) return false;
    }
    let sr=r-r%3, sc=c-c%3;
    for(let i=0;i<3;i++)
      for(let j=0;j<3;j++)
        if(g[sr+i][sc+j]==n) return false;
    return true;
  }

  function solve(g){
    for(let r=0;r<9;r++){
      for(let c=0;c<9;c++){
        if(g[r][c]==0){
          for(let n=1;n<=9;n++){
            if(isValid(g,r,c,n)){
              g[r][c]=n;
              if(solve(g)) return true;
              g[r][c]=0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }

  let g=Array.from({length:9},()=>Array(9).fill(0));
  solve(g);

  let holes = diff=="easy"?40:diff=="medium"?50:60;

  while(holes>0){
    let r=Math.floor(Math.random()*9);
    let c=Math.floor(Math.random()*9);
    if(g[r][c]!=0){
      g[r][c]=0;
      holes--;
    }
  }

  return g.flat().join("");
}

/* CARICA */
function loadPuzzle(p){
  cells.forEach((c,i)=>{
    let v=p[i];
    if(v!="0"){
      c.value=parseInt(v);
      c.big.innerText=v;
      c.fixed=true;
    } else {
      c.value=null;
      c.big.innerText="";
      c.fixed=false;
    }
  });
  recalc();
}

/* SAVE */
function saveGame(){
  localStorage.setItem("sudoku",
    JSON.stringify(cells.map(c=>({
      value:c.value,
      fixed:c.fixed
    })))
  );
}

function loadGame(){
  let data=JSON.parse(localStorage.getItem("sudoku"));
  if(!data) return;

  cells.forEach((c,i)=>{
    c.value=data[i].value;
    c.fixed=data[i].fixed;
    c.big.innerText=c.value||"";
  });
  recalc();
}

</script>
</body>
</html>
