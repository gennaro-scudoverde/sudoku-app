<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192x192.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="theme-color" content="#4CAF50">

<title>Sudoku</title>

<style>
body {
  margin: 0;
  text-align: center;
  font-family: Arial;
  background: #f4f6f8;
}

#grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: 95vw;
  max-width: 500px;
  margin: 20px auto;
}

.cell {
  aspect-ratio: 1;
  border: 1px solid #999;
  position: relative;
}

.selected { background:#ffe9a8; }
.highlight { background:#eef3ff; }
.same { background:#ffe082; }

.big {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.notes {
  position:absolute;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  font-size:10px;
  color:#c44;
}

.notes div {
  display:flex;
  align-items:center;
  justify-content:center;
}

button {
  margin:5px;
  padding:10px;
  border-radius:10px;
}

/* BORDI 3x3 */
.cell:nth-child(3n) { border-right: 3px solid black; }
.cell:nth-child(9n+1) { border-left: 3px solid black; }
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 3px solid black;
}
.cell:nth-child(-n+9) { border-top: 3px solid black; }

</style>
</head>

<body>

<h2>Sudoku</h2>
<div id="grid"></div>
<div id="controls"></div>

<script>

let grid = document.getElementById("grid");
let controls = document.getElementById("controls");

let cells = [];
let selectedIndex = -1;
let gameOn = true;

/* CREA CELLE */
for (let i = 0; i < 81; i++) {

  let cell = document.createElement("div");
  cell.className = "cell";

  let notes = document.createElement("div");
  notes.className = "notes";

  let noteEls = [];

  for (let n=1;n<=9;n++){
    let d=document.createElement("div");
    d.innerText=n;
    notes.appendChild(d);
    noteEls.push(d);
  }

  let big = document.createElement("div");
  big.className = "big";

  cell.appendChild(notes);
  cell.appendChild(big);

  cells.push({
    el:cell,
    big:big,
    notes:notes,
    noteEls:noteEls,
    value:null,
    fixed:false
  });

  cell.onclick=function(){
    selectedIndex=i;
    highlight(i);
  };

  grid.appendChild(cell);
}

/* EVIDENZIA */
function highlight(index){

  cells.forEach(c=>{
    c.el.classList.remove("selected","highlight","same");
  });

  let row=Math.floor(index/9);
  let col=index%9;
  let val=cells[index].value;

  cells.forEach((c,i)=>{
    let r=Math.floor(i/9);
    let co=i%9;

    let sameBox =
      Math.floor(r/3)==Math.floor(row/3) &&
      Math.floor(co/3)==Math.floor(col/3);

    if(r==row || co==col || sameBox){
      c.el.classList.add("highlight");
    }

    if(val && c.value==val){
      c.el.classList.add("same");
    }
  });

  cells[index].el.classList.add("selected");
}

/* RECALCOLO NOTE */
function recalc(){

  cells.forEach(c=>{
    for(let n of c.noteEls) n.style.visibility="visible";
    if(!c.value) c.notes.style.display="grid";
  });

  for(let i=0;i<81;i++){
    let val=cells[i].value;
    if(val){
      cells[i].notes.style.display="none";

      let row=Math.floor(i/9);
      let col=i%9;

      for(let j=row*9;j<row*9+9;j++)
        cells[j].noteEls[val-1].style.visibility="hidden";

      for(let j=col;j<81;j+=9)
        cells[j].noteEls[val-1].style.visibility="hidden";

      let sr=Math.floor(row/3)*3;
      let sc=Math.floor(col/3)*3;

      for(let r=sr;r<sr+3;r++)
        for(let c=sc;c<sc+3;c++)
          cells[r*9+c].noteEls[val-1].style.visibility="hidden";
    }
  }
}

/* NUMERI */
for(let n=1;n<=9;n++){
  let b=document.createElement("button");
  b.innerText=n;

  b.onclick=function(){
    if(selectedIndex==-1) return;

    let c=cells[selectedIndex];
    if(c.fixed) return;

    if(c.value===n){
      c.value=null;
      c.big.innerText="";
    } else {
      c.value=n;
      c.big.innerText=n;
    }

    recalc();
    highlight(selectedIndex);
  };

  controls.appendChild(b);
}

controls.appendChild(document.createElement("br"));

/* RESET */
let reset=document.createElement("button");
reset.innerText="RESET";
reset.onclick=function(){
  cells.forEach(c=>{
    c.value=null;
    c.fixed=false;
    c.big.innerText="";
  });
  recalc();
};

controls.appendChild(reset);

/* FISSA */
let fissa=document.createElement("button");
fissa.innerText="FISSA";
fissa.onclick=function(){
  cells.forEach(c=>{
    if(c.value){
      c.fixed=true;
      c.big.style.color="black";
    }
  });
};

controls.appendChild(fissa);

controls.appendChild(document.createElement("br"));

/* GENERATORE */

function isValid(grid, row, col, num){
  for(let x=0;x<9;x++){
    if(grid[row][x]==num) return false;
    if(grid[x][col]==num) return false;
  }

  let sr=row-row%3;
  let sc=col-col%3;

  for(let r=0;r<3;r++)
    for(let c=0;c<3;c++)
      if(grid[sr+r][sc+c]==num) return false;

  return true;
}

function solve(grid){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if(grid[r][c]==0){
        for(let n=1;n<=9;n++){
          if(isValid(grid,r,c,n)){
            grid[r][c]=n;
            if(solve(grid)) return true;
            grid[r][c]=0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

function generate(difficulty){

  let g = Array.from({length:9},()=>Array(9).fill(0));
  solve(g);

  let holes = difficulty=="easy"?40:
              difficulty=="medium"?50:60;

  while(holes>0){
    let r=Math.floor(Math.random()*9);
    let c=Math.floor(Math.random()*9);

    if(g[r][c]!=0){
      g[r][c]=0;
      holes--;
    }
  }

  return g.flat().join("");
}

function loadPuzzle(p){
  cells.forEach((c,i)=>{
    let v=p[i];
    if(v!="0"){
      c.value=parseInt(v);
      c.big.innerText=v;
      c.fixed=true;
    } else {
      c.value=null;
      c.big.innerText="";
      c.fixed=false;
    }
  });
  recalc();
}

/* BOTTONI DIFFICOLTÀ */

["easy","medium","hard"].forEach(d=>{
  let b=document.createElement("button");
  b.innerText=d.toUpperCase();

  b.onclick=function(){
    let p=generate(d);
    loadPuzzle(p);
  };

  controls.appendChild(b);
});

</script>
</body>
</html>
