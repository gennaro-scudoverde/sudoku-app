<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192x192.png">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="theme-color" content="#4CAF50">

<title>Sudoku</title>

<style>

body {
  margin: 0;
  text-align: center;
  font-family: Arial;
  background: #f4f6f8;
}

#grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: 95vw;
  max-width: 500px;
  margin: 20px auto;
}

.cell {
  aspect-ratio: 1;
  border: 1px solid #999;
  position: relative;
}

.selected { background:#ffe9a8; }
.highlight { background:#eef3ff; }
.same { background:#ffe082; }

.big {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

button {
  margin:5px;
  padding:10px;
  border-radius:10px;
}

/* BORDI 3x3 */
.cell:nth-child(3n) { border-right: 3px solid black; }
.cell:nth-child(9n+1) { border-left: 3px solid black; }
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 3px solid black;
}
.cell:nth-child(-n+9) { border-top: 3px solid black; }

</style>
</head>

<body>

<h2>Sudoku</h2>
<div id="grid"></div>
<div id="controls"></div>



<script>

let grid = document.getElementById("grid");
let controls = document.getElementById("controls");

let cells = [];
let selectedIndex = -1;
let savedState = null;
let inTest = false;
let gameOn = false;

/* CREA CELLE */
for (let i = 0; i < 81; i++) {

  let cell = document.createElement("div");
  cell.className = "cell";

  let big = document.createElement("div");
  big.className = "big";

  cell.appendChild(big);

  cells.push({
    el:cell,
    big:big,
    value:null,
    fixed:false
  });

  cell.onclick=function(){
    if(!gameOn) return;

    selectedIndex=i;
    highlight(i);
  };

  grid.appendChild(cell);
}

/* EVIDENZIA */
function highlight(index){

  cells.forEach(c=>{
    c.el.classList.remove("selected","highlight","same");
  });

  let row=Math.floor(index/9);
  let col=index%9;
  let val=cells[index].value;

  cells.forEach((c,i)=>{
    let r=Math.floor(i/9);
    let co=i%9;

    let sameBox =
      Math.floor(r/3)==Math.floor(row/3) &&
      Math.floor(co/3)==Math.floor(col/3);

    if(r==row || co==col || sameBox){
      c.el.classList.add("highlight");
    }

    if(val && c.value==val){
      c.el.classList.add("same");
    }
  });

  cells[index].el.classList.add("selected");
}

/* NUMERI */
for(let n=1;n<=9;n++){
  let b=document.createElement("button");
  b.innerText=n;

  b.onclick=function(){
    if(!gameOn || selectedIndex==-1) return;

    let c=cells[selectedIndex];
    if(c.fixed) return;

    if(c.value===n){
      c.value=null;
      c.big.innerText="";
    } else {
      c.value=n;
      c.big.innerText=n;
    }

    highlight(selectedIndex);
  };

  controls.appendChild(b);
}

/* BOTTONI */
controls.appendChild(document.createElement("br"));

let on=document.createElement("button");
on.innerText="ON";
on.onclick=function(){
  loadGame();
  gameOn=true;
};

let prova=document.createElement("button");
prova.innerText="PROVA";
prova.onclick=function(){
  if(!inTest){
    savedState=cells.map(c=>({value:c.value}));
    inTest=true;
    prova.innerText="TORNA";
  }else{
    cells.forEach((c,i)=>{
      c.value=savedState[i].value;
      c.big.innerText=c.value||"";
    });
    inTest=false;
    prova.innerText="PROVA";
  }
};

let off=document.createElement("button");
off.innerText="OFF";
off.onclick=function(){
  saveGame();
  gameOn=false;
};

let reset=document.createElement("button");
reset.innerText="RESET";
reset.onclick=function(){
  cells.forEach(c=>{
    c.value=null;
    c.fixed=false;
    c.big.innerText="";
  });
};

let fissa=document.createElement("button");
fissa.innerText="FISSA";
fissa.onclick=function(){
  cells.forEach(c=>{
    if(c.value){
      c.fixed=true;
      c.big.style.color="black";
    }
  });
};

controls.appendChild(on);
controls.appendChild(prova);
controls.appendChild(off);
controls.appendChild(reset);
controls.appendChild(fissa);

/* CARICA PUZZLE */
function loadPuzzle(p){
  cells.forEach((c,i)=>{
    let v=p[i];
    if(v!="0"){
      c.value=parseInt(v);
      c.big.innerText=v;
      c.fixed=true;
    } else {
      c.value=null;
      c.big.innerText="";
      c.fixed=false;
    }
  });
}

/* DIFFICOLTÀ */
controls.appendChild(document.createElement("br"));

function generateSudoku(difficulty){

  // soluzione base (valida)
  let base = [
    "123456789",
    "456789123",
    "789123456",
    "214365897",
    "365897214",
    "897214365",
    "531642978",
    "642978531",
    "978531642"
  ];

  // mescola righe
  base.sort(() => Math.random() - 0.5);

  let grid = base.join("").split("");

  // rimuovi numeri in base alla difficoltà
  let holes = 40; // easy

  if(difficulty === "medium") holes = 50;
  if(difficulty === "hard") holes = 60;

  for(let i=0;i<holes;i++){
    let idx = Math.floor(Math.random()*81);
    grid[idx] = "0";
  }

  return grid.join("");
}

controls.appendChild(document.createElement("br"));

["easy","medium","hard"].forEach(diff=>{
  let b=document.createElement("button");
  b.innerText=diff.toUpperCase();

  b.onclick=function(){
    let puzzle = generateSudoku(diff);
    loadPuzzle(puzzle);
    gameOn=true;
  };

  controls.appendChild(b);
});


/* SAVE */
function saveGame(){
  let data=cells.map(c=>({
    value:c.value,
    fixed:c.fixed
  }));
  localStorage.setItem("sudoku",JSON.stringify(data));
}

function loadGame(){
  let data=JSON.parse(localStorage.getItem("sudoku"));
  if(!data) return;

  cells.forEach((c,i)=>{
    c.value=data[i].value;
    c.big.innerText=c.value||"";
    c.fixed=data[i].fixed;
  });
}

</script>

</body>
</html>
